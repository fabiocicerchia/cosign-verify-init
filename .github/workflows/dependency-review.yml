name: dependency-review

# Blocks PRs that introduce dependencies (GitHub Actions, base images) with
# known vulnerabilities or incompatible licenses. Uses GitHub's Dependency
# Graph (on by default for public repos).
#
# ponytail: actions are tag-pinned here; SHA-pin via
# `pinact run` for parity with ci.yml/release.yml.

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
