name: dependency-review

# Blocks PRs that introduce dependencies (GitHub Actions, base images) with
# known vulnerabilities or incompatible licenses. Uses GitHub's Dependency
# Graph (on by default for public repos).
#
# ponytail: actions are tag-pinned to match the skeleton; SHA-pin via
# `pinact run` for parity with ci.yml/release.yml.

on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
